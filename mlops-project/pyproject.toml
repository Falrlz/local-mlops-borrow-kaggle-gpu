[project]
name = "mlops-project"
version = "0.1.0"
description = "Example image classification project: train locally or on a borrowed Kaggle GPU, track runs in MLflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Deep learning (PyPI wheels: CPU build on Windows, CUDA build on Linux/Kaggle)
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    # Experiment tracking
    "mlflow>=2.14.0",
    # Data, metrics, plots
    "pillow>=10.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    # Config and logging
    "pyyaml>=6.0.0",
    "pydantic>=2.8.0",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "ipykernel>=6.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
exclude = [
    ".venv",
    "__pycache__",
    "data",
    "outputs",
    "models",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming (function snake_case, class PascalCase)
    "PTH", # flake8-use-pathlib (enforce pathlib.Path over os.path)
    "BLE", # flake8-blind-except (avoid bare except / blind Exception)
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001"]
"notebooks/**" = ["E741", "F841", "W293", "W291", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyrefly]
# Imports start from mlops-project/ (`from src.core...`), not from src/
search-path = ["."]
